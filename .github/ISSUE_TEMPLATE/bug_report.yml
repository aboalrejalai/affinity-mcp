name: Bug report
description: A recipe, reference or plugin does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you asked the agent, what it did, and what you expected.
    validations: { required: true }
  - type: textarea
    id: script
    attributes:
      label: Script or error output
      description: The execute_script code and console output, if available. Remove personal paths and data.
      render: javascript
  - type: input
    id: affinity
    attributes:
      label: Affinity by Canva version
      placeholder: "3.3.1 (build 4940)"
    validations: { required: true }
  - type: dropdown
    id: client
    attributes:
      label: Agent / client
      options: [Claude Code, Claude Desktop, Cursor, Codex, Other]
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Windows]
